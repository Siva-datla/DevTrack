<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="devtrack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="devtrack-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Squircle with subtle gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#devtrack-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#devtrack-stroke)" stroke-width="2" />

  <!-- Terminal Prompt Chevron (Crisp White) -->
  <path
    d="M19 20L31 32L19 44"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Tracking Cursor Line (Electric Cyan) -->
  <line
    x1="37"
    y1="44"
    x2="47"
    y2="44"
    stroke="#38BDF8"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Active Tracking Live Indicator (Emerald Green) -->
  <circle cx="45" cy="22" r="3.5" fill="#10B981" />
</svg>
